version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: class_scheduler_db
    restart: always
    environment:
      POSTGRES_USER: scheduler_user
      POSTGRES_PASSWORD: scheduler_password
      POSTGRES_DB: classes_scheduler
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler_user -d classes_scheduler"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
